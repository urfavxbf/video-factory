name: Diagnose Cloudflare Worker Reachability

on:
  pull_request:
    paths:
      - ".github/workflows/diagnose-worker.yml"
      - "scripts/kuri_cloud_pack.py"
      - ".github/workflows/generate-kuri-pack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-worker-health:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check public Worker health without credentials
        shell: bash
        env:
          WORKER_HEALTH_URL: https://video-factory-content-kit.wordplays-transcribe.workers.dev/health
        run: |
          python3 - <<'PY'
          import os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          request = Request(os.environ["WORKER_HEALTH_URL"], headers={
              "User-Agent": "VideoFactory-GitHub-Actions/1.0",
              "Accept": "application/json",
          })
          try:
              with urlopen(request, timeout=20) as response:
                  print("Health HTTP status:", response.status)
                  print("Content type:", response.headers.get("content-type", "unknown"))
                  if response.status != 200:
                      raise SystemExit("Health endpoint did not return HTTP 200")
          except HTTPError as error:
              print("Health HTTP status:", error.code)
              print("Content type:", error.headers.get("content-type", "unknown"))
              print("Server:", error.headers.get("server", "unknown"))
              body = error.read(4096).decode("utf-8", errors="replace").lower()
              for marker in ("cloudflare access", "error 1020", "access denied",
                             "error 1010", "workers.dev", "captcha"):
                  if marker in body:
                      print("Safe diagnostic marker:", marker)
              raise SystemExit("Worker health blocked before authentication.")
          except URLError:
              raise SystemExit("Worker health DNS/network connectivity failed.")
          PY


      - name: Probe unauthorized POST for routing behavior (no API token)
        shell: bash
        env:
          WORKER_API_URL: https://video-factory-content-kit.wordplays-transcribe.workers.dev/v1/generate
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          body = json.dumps({"topic":"Sample science topic","angle":"","previousTitles":[]}).encode()
          request = Request(os.environ["WORKER_API_URL"], data=body, method="POST", headers={
              "Authorization": "Bearer diagnostic-invalid-token",
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "VideoFactory-GitHub-Actions/1.0",
          })
          try:
              with urlopen(request, timeout=20) as response:
                  print("Unexpected unauthorized POST response:", response.status)
                  raise SystemExit(1)
          except HTTPError as error:
              print("Unauthenticated POST HTTP status:", error.code)
              print("Content type:", error.headers.get("content-type", "unknown"))
              print("Server:", error.headers.get("server", "unknown"))
              body = error.read(4096).decode("utf-8", errors="replace").lower()
              for marker in ("cloudflare access", "error 1020", "access denied",
                             "error 1010", "captcha", "unauthorized"):
                  if marker in body:
                      print("Safe diagnostic marker:", marker)
              if error.code != 401:
                  raise SystemExit("Unauthenticated POST was blocked outside Worker auth.")
          PY


      - name: Probe Python urllib default user agent (no token)
        shell: bash
        env:
          WORKER_API_URL: https://video-factory-content-kit.wordplays-transcribe.workers.dev/v1/generate
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError

          request = Request(os.environ["WORKER_API_URL"],
              method="POST",
              data=json.dumps({"topic":"Bakit may kakaibang amoy ang ulan?","angle":"Ipaliwanag ang petrichor sa masayang, madaling maintindihang paraan.","previousTitles":[]}).encode(),
              headers={
                  "Authorization": "Bearer diagnostic-invalid-token",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              })
          try:
              with urlopen(request, timeout=20) as response:
                  raise SystemExit(f"Unexpected accepted test token: {response.status}")
          except HTTPError as error:
              print("Python urllib default UA status:", error.code)
              print("Content type:", error.headers.get("content-type", "unknown"))
              if error.code == 403:
                  print("Confirmed: legacy default Python urllib UA is blocked at the edge.")
              elif error.code != 401:
                  raise SystemExit("Unexpected legacy request status.")
          PY

      - name: Live KURI generation smoke test (this PR only)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 17
        shell: bash
        env:
          APP_ACCESS_TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}
          KURI_WORKER_ORIGIN: https://video-factory-content-kit.wordplays-transcribe.workers.dev
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from scripts.kuri_cloud_pack import main
          import os, sys
          if len(os.getenv("APP_ACCESS_TOKEN", "")) < 12:
              raise SystemExit("Missing APP_ACCESS_TOKEN in production environment")
          sys.argv = ["kuri_cloud_pack.py", "--topic", "Bakit may kakaibang amoy ang ulan?",
                      "--angle", "Science explanation using seven original animated scenes",
                      "--output-dir", "/tmp/kuri-cloud-smoke"]
          code = main()
          assert Path("/tmp/kuri-cloud-smoke/kuri-review-pack.json").is_file()
          print("Real Worker generate + storyboard calls succeeded with explicit user agent.")
          raise SystemExit(code)
          PY
