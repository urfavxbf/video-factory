name: Validate Content Kit Worker

on:
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/validate-worker.yml"
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/validate-worker.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check worker/src/index.mjs
      - name: Unit tests
        run: node --test worker/test/*.test.mjs
