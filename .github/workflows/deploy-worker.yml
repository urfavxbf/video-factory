name: Deploy Content Kit Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ACCESS_TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APP_ACCESS_TOKEN PIXABAY_API_KEY; do
            if [[ -z "${!name}" ]]; then echo "Missing required secret: $name"; exit 1; fi
          done
      - name: Test Worker
        run: node --test worker/test/*.test.mjs
      - name: Deploy authenticated backend
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            APP_ACCESS_TOKEN
            PIXABAY_API_KEY
        env:
          APP_ACCESS_TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
