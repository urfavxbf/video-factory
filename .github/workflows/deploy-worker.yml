name: Deploy Content Kit Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ACCESS_TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APP_ACCESS_TOKEN PIXABAY_API_KEY; do
            if [[ -z "${!name}" ]]; then echo "Missing required secret: $name"; exit 1; fi
          done
      - name: Test Worker
        run: node --test worker/test/*.test.mjs
      # Uploading secrets before the Worker exists can fail on first deploy.
      # Wrangler deploy --secrets-file sends code and secrets in one operation.
      - name: Deploy Worker and private secrets together
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_ACCESS_TOKEN: ${{ secrets.APP_ACCESS_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo '::error::Invalid Cloudflare account ID format (expected 32 hexadecimal characters).'
            exit 1
          fi
          secrets_file="$(mktemp "$RUNNER_TEMP/vf-worker-secrets.XXXXXX")"
          trap 'rm -f "$secrets_file"' EXIT
          export VF_SECRETS_FILE="$secrets_file"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          values = {
              'APP_ACCESS_TOKEN': os.environ['APP_ACCESS_TOKEN'],
              'PIXABAY_API_KEY': os.environ['PIXABAY_API_KEY'],
          }
          Path(os.environ['VF_SECRETS_FILE']).write_text(json.dumps(values), encoding='utf-8')
          PY
          if ! npx --yes wrangler@4 deploy --secrets-file "$secrets_file"; then
            echo '::error::Deployment denied. Check Cloudflare token Workers Scripts Edit/Workers Editor permission and account scope.'
            exit 1
          fi
