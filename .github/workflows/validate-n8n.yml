name: Validate n8n workflow
on:
  pull_request:
    paths:
      - "n8n/**"
      - ".github/workflows/validate-n8n.yml"
  push:
    branches: [main]
    paths:
      - "n8n/**"
      - ".github/workflows/validate-n8n.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install YAML parser
        run: python -m pip install "PyYAML==6.0.3"
      - name: Validate n8n workflow and Compose
        run: python n8n/tests/validate_config.py
